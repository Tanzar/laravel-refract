name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 8.5 - Laravel 13.*

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Type Coverage
        run: composer test:types

      - name: Test Suite
        env:
         DB_CONNECTION: sqlite
         DB_DATABASE: ":memory:"
        run: vendor/bin/pest
